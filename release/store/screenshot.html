<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Play phone screenshot, 1080×1920. Rendered by release/store/make-assets.sh: ?img=src/x.jpg&title=…&sub=… -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { background: radial-gradient(90% 55% at 50% 100%, #2a3560 0%, transparent 70%), linear-gradient(#0f1733, #0a1128);
         font-family: Inter, sans-serif; color: #e6ebf7; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 120px 80px 0; font-size: 76px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
  h1 em { font-style: normal; color: #f0b45e; }
  p { margin: 28px 80px 0; font-size: 38px; line-height: 1.3; color: #a9b4d4; text-align: center; }
  .phone { margin-top: auto; margin-bottom: 72px; width: 690px; height: 1374px; border-radius: 64px; padding: 14px; background: #04070d;
           box-shadow: 0 0 0 2px rgba(214,224,248,.14), 0 50px 120px -30px rgba(240,180,94,.35); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 50px; display: block; }
</style>
</head>
<body>
  <h1 id="t"></h1>
  <p id="s"></p>
  <div class="phone"><img id="i" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    // *word* in the title is drawn in the amber accent.
    document.getElementById("t").innerHTML = (q.get("title") || "").replace(/\*(.+?)\*/g, "<em>$1</em>");
    document.getElementById("s").textContent = q.get("sub") || "";
    document.getElementById("i").src = q.get("img");
  </script>
</body>
</html>
